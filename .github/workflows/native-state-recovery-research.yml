name: Native state recovery research (SR1 only)
on:
  push:
    branches: [docs/plugin-research-hot-reload-20261021]
    paths:
      - .github/workflows/native-state-recovery-research.yml
      - docs/research/evidence/native-state-recovery-20261026-inputs.*
permissions:
  contents: read
jobs:
  sr1:
    if: github.repository == 'agent-teams-ai/extension-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NATIVE_ROOT: ${{ runner.temp }}/native-state-recovery
      EVIDENCE: ${{ runner.temp }}/native-state-recovery-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing repo pin
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9; existing repo pin
        timeout-minutes: 1
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; existing repo pin
        timeout-minutes: 1
        with:
          node-version: 26.11.1
      - name: Verify reviewed inputs and stage exact native tools
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NATIVE_ROOT" "$EVIDENCE"
          id > "$EVIDENCE/runner-identity.txt"
          df -B1 "$RUNNER_TEMP" > "$EVIDENCE/disk-before.txt"
          printf 'prior_job_status=%s\n' '${{ job.status }}' > "$EVIDENCE/staging-status.txt"
          test '${{ job.status }}' = success
          test "$(id -u)" -ne 0
          sha256sum -c docs/research/evidence/native-state-recovery-20261026-inputs.sha256 > "$EVIDENCE/input-integrity.log" 2>&1
          tar -xzf docs/research/evidence/native-state-recovery-20261026-inputs.tar.gz -C "$NATIVE_ROOT"
          timeout --kill-after=5s 120s bash "$NATIVE_ROOT/bootstrap-native.sh" > "$EVIDENCE/bootstrap.log" 2>&1
      - name: Strict SR1 gate and real restore (SR2 blocked)
        timeout-minutes: 5
        shell: bash
        run: |
          set +e
          cd "$NATIVE_ROOT/state-recovery" || exit 1
          timeout --signal=TERM --kill-after=5s 240s bash run-ci.sh
          outcome=$?
          printf 'exit=%s\n' "$outcome" > "$EVIDENCE/outer-outcome.txt"
          if [[ "$outcome" = 124 || "$outcome" = 137 ]]; then
            printf 'classification=failed_outer_termination_cleanup_unproved\n' >> "$EVIDENCE/outer-outcome.txt"
          fi
          exit "$outcome"
      - name: Retain evidence, synthetic logical archive and failed logs; exclude physical DB data
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # official v7.0.2
        with:
          name: native-state-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-state-recovery-evidence/
            !${{ runner.temp }}/native-state-recovery-evidence/**/data/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
