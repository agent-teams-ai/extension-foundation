name: Native Live Module Contract Research

# Frozen public Piral/Resources and Effect boundary probes, not production adoption.
on:
  push:
    branches:
      - docs/plugin-research-hot-reload-20261021
    paths:
      - .github/workflows/live-module-contracts-research.yml
      - docs/research/evidence/live-module-contracts-v1-input-20261123.tar.gz
      - docs/research/evidence/live-module-contracts-v1-input-20261123.manifest.json

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [piral-lifecycle, effect-close]
    env:
      CONTRACT_RESEARCH_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Establish isolated paths in the runner environment
        shell: bash
        run: |
          printf 'CONTRACT_RESEARCH_ROOT=%s/live-module-contracts-%s\n' "$RUNNER_TEMP" "$CONTRACT_RESEARCH_PROFILE" >> "$GITHUB_ENV"
          printf 'CONTRACT_RESEARCH_DIRECTORY=%s/live-module-contracts-%s/%s\n' "$RUNNER_TEMP" "$CONTRACT_RESEARCH_PROFILE" "$CONTRACT_RESEARCH_PROFILE" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact frozen input and extract with the standard data filter
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path, PurePosixPath
          base = Path('docs/research/evidence')
          manifest = json.loads((base / 'live-module-contracts-v1-input-20261123.manifest.json').read_text())
          archive = base / 'live-module-contracts-v1-input-20261123.tar.gz'
          content = archive.read_bytes()
          assert len(content) == manifest['bytes']
          assert hashlib.sha256(content).hexdigest() == manifest['sha256']
          destination = Path(os.environ['CONTRACT_RESEARCH_ROOT']).resolve()
          destination.mkdir()
          expected = {entry['path']: entry for entry in manifest['members']}
          assert len(expected) == len(manifest['members'])
          with tarfile.open(archive) as handle:
              members = handle.getmembers()
              assert len(members) == len(expected)
              assert {member.name for member in members} == set(expected)
              assert all(member.isfile() for member in members)
              assert all(not PurePosixPath(member.name).is_absolute() and '..' not in PurePosixPath(member.name).parts for member in members)
              handle.extractall(destination, filter='data')
          for name, entry in expected.items():
              content = (destination / name).read_bytes()
              assert len(content) == entry['bytes']
              assert hashlib.sha256(content).hexdigest() == entry['sha256']
          profile = os.environ['CONTRACT_RESEARCH_PROFILE']
          evidence = destination / profile / 'evidence' / 'hosted'
          evidence.mkdir(parents=True)
          receipt = {'commit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                     'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'profile': profile,
                     'input': manifest,
                     'workflowSha256': hashlib.sha256(Path('.github/workflows/live-module-contracts-research.yml').read_bytes()).hexdigest()}
          (evidence / 'input-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          package_json_file: ${{ env.CONTRACT_RESEARCH_DIRECTORY }}/package.json
      - name: Install and verify the exact native-platform dependency closure
        working-directory: ${{ env.CONTRACT_RESEARCH_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --engine-strict --strict-peer-dependencies 2>&1 | tee evidence/hosted/install.log
          python - <<'PY'
          import hashlib, json, platform
          from pathlib import Path
          package = json.loads(Path('package.json').read_text())
          expected_direct = package.get('dependencies', {}) | package.get('devDependencies', {})
          actual_direct = {name: json.loads((Path('node_modules') / name / 'package.json').read_text())['version'] for name in expected_direct}
          assert actual_direct == expected_direct
          audit = json.loads(Path('dependency-audit.json').read_text())
          assert platform.system() == 'Linux' and platform.machine() == 'x86_64'
          assert platform.libc_ver()[0] == 'glibc'
          assert audit['platform'] == {'os': 'linux', 'architecture': 'x64', 'libc': 'glibc'}
          assert hashlib.sha256(Path('pnpm-lock.yaml').read_bytes()).hexdigest() == audit['lockSha256']
          expected = {(item['name'], item['version']): item for item in audit['packages']}
          actual = {}
          # Inspect installed package roots only. The lock also lists optional packages
          # for other OS/CPU targets; those are not asserted to exist on this runner.
          for pattern in ['*/node_modules/*/package.json', '*/node_modules/@*/*/package.json']:
              for path in Path('node_modules/.pnpm').glob(pattern):
                  data = json.loads(path.read_text())
                  actual[(data['name'], data['version'])] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert set(actual) == set(expected), {'added': sorted(set(actual) - set(expected)), 'missing': sorted(set(expected) - set(actual))}
          assert all(actual[key] == expected[key]['manifestSha256'] for key in actual)
          compilers = [(name, version) for name, version in actual if name == 'typescript' or name.startswith('@typescript/typescript-')]
          assert compilers and all(version == '7.0.2' for _, version in compilers)
          executable = audit['compilerExecutable']
          assert hashlib.sha256(Path(executable['path']).read_bytes()).hexdigest() == executable['sha256']
          Path('evidence/hosted/installed-identities.json').write_text(json.dumps({'direct': actual_direct, 'packages': sorted(actual), 'compilerPackages': compilers, 'compilerSha256': executable['sha256']}, indent=2) + '\n')
          PY
          node --version > evidence/hosted/environment.txt
          pnpm --version >> evidence/hosted/environment.txt
          pnpm exec tsc --version >> evidence/hosted/environment.txt
      - name: Strictly check every maintained TypeScript source and public declaration
        working-directory: ${{ env.CONTRACT_RESEARCH_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee evidence/hosted/typecheck.log
      - name: Build genuine published Piral with its official code generator
        if: matrix.profile == 'piral-lifecycle'
        working-directory: ${{ env.CONTRACT_RESEARCH_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee evidence/hosted/build.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [{'path': str(path), 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in sorted(Path('dist').rglob('*')) if path.is_file()]
          Path('evidence/hosted/generated-output.json').write_text(json.dumps({'evidenceClass': 'genuine generated production bundle, not maintained source', 'files': files}, indent=2) + '\n')
          PY
      - name: Install the pinned Playwright Chromium
        if: matrix.profile == 'piral-lifecycle'
        working-directory: ${{ env.CONTRACT_RESEARCH_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee evidence/hosted/browser-install.log
      - name: Execute only the frozen bounded native cases
        working-directory: ${{ env.CONTRACT_RESEARCH_DIRECTORY }}
        env:
          DEBUG: pw:browser
        shell: bash
        run: |
          set -o pipefail
          pnpm probe 2>&1 | tee evidence/hosted/native.log
      - name: Retain exact input, original failures, generated output and licenses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-module-contracts-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CONTRACT_RESEARCH_DIRECTORY }}/evidence/
            ${{ env.CONTRACT_RESEARCH_DIRECTORY }}/dist/
            ${{ env.CONTRACT_RESEARCH_DIRECTORY }}/*.ts
            ${{ env.CONTRACT_RESEARCH_DIRECTORY }}/*.tsx
            ${{ env.CONTRACT_RESEARCH_DIRECTORY }}/*.json
            ${{ env.CONTRACT_RESEARCH_DIRECTORY }}/pnpm-lock.yaml
            ${{ env.CONTRACT_RESEARCH_DIRECTORY }}/index.html
            ${{ env.CONTRACT_RESEARCH_ROOT }}/third-party-licenses/
            ${{ env.CONTRACT_RESEARCH_ROOT }}/SPIKE-PLAN.md
            ${{ env.CONTRACT_RESEARCH_ROOT }}/SPIKE-REVIEW.md
            ${{ env.CONTRACT_RESEARCH_ROOT }}/SOURCE-INVENTORY.json
            ${{ env.CONTRACT_RESEARCH_ROOT }}/FROZEN-INPUTS.json
            ${{ github.workspace }}/.github/workflows/live-module-contracts-research.yml
            ${{ github.workspace }}/docs/research/evidence/live-module-contracts-v1-input-20261123.manifest.json
            ${{ github.workspace }}/docs/research/evidence/live-module-contracts-v1-input-20261123.tar.gz
          if-no-files-found: error
          retention-days: 30
