name: Plugin Reload Reuse Spikes

# Native development-HMR research, not a production runtime or release job.
on:
  push:
    branches:
      - docs/plugin-research-hot-reload-20261021
    paths:
      - .github/workflows/plugin-reload-reuse-spikes.yml
      - docs/research/evidence/plugin-reload-browser-input-20261122.tar.gz
      - docs/research/evidence/plugin-reload-browser-input-20261122.manifest.json

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELOAD_RESEARCH_DIRECTORY: ${{ github.workspace }}/../plugin-reload-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify frozen source and extract with the standard data filter
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          base = Path('docs/research/evidence')
          manifest = json.loads((base / 'plugin-reload-browser-input-20261122.manifest.json').read_text())
          archive = base / 'plugin-reload-browser-input-20261122.tar.gz'
          content = archive.read_bytes()
          assert len(content) == manifest['archive']['bytes']
          assert hashlib.sha256(content).hexdigest() == manifest['archive']['sha256']
          destination = Path(os.environ['RELOAD_RESEARCH_DIRECTORY'])
          destination.mkdir()
          expected = {entry['path']: entry for entry in manifest['files']}
          assert len(expected) == len(manifest['files'])
          with tarfile.open(archive) as handle:
              members = handle.getmembers()
              assert len(members) == len(expected)
              assert {member.name for member in members} == set(expected)
              assert all(member.isfile() for member in members)
              handle.extractall(destination, filter='data')
          for name, entry in expected.items():
              content = (destination / name).read_bytes()
              assert len(content) == entry['bytes']
              assert hashlib.sha256(content).hexdigest() == entry['sha256']
          evidence = destination / 'evidence'
          evidence.mkdir()
          receipt = {'commit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                     'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'input': manifest['archive'],
                     'workflow': hashlib.sha256(Path('.github/workflows/plugin-reload-reuse-spikes.yml').read_bytes()).hexdigest()}
          (evidence / 'hosted-input-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.25.0
          package_json_file: ${{ env.RELOAD_RESEARCH_DIRECTORY }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - name: Install exact disposable dependencies
        working-directory: ${{ env.RELOAD_RESEARCH_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --ignore-scripts --engine-strict --strict-peer-dependencies 2>&1 | tee evidence/hosted-install.log
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('package.json').read_text())['devDependencies']
          actual = {name: json.loads((Path('node_modules') / name / 'package.json').read_text())['version'] for name in expected}
          assert actual == expected
          assert actual['typescript'] == '7.0.2'
          Path('evidence/installed-direct-identities.json').write_text(json.dumps(actual, indent=2) + '\n')
          PY
          node --version > evidence/hosted-environment.txt
          pnpm --version >> evidence/hosted-environment.txt
      - name: Strictly check all TypeScript sources and variants
        working-directory: ${{ env.RELOAD_RESEARCH_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee evidence/hosted-typecheck.log
      - name: Install pinned native Chromium
        working-directory: ${{ env.RELOAD_RESEARCH_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee evidence/hosted-browser-install.log
      - name: Exercise real browser HMR and rejecting scenarios
        working-directory: ${{ env.RELOAD_RESEARCH_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee evidence/hosted-runtime.log
      - name: Retain source and observed outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-reload-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RELOAD_RESEARCH_DIRECTORY }}/evidence/
            ${{ env.RELOAD_RESEARCH_DIRECTORY }}/fixture/
            ${{ env.RELOAD_RESEARCH_DIRECTORY }}/browser.test.ts
            ${{ env.RELOAD_RESEARCH_DIRECTORY }}/package.json
            ${{ env.RELOAD_RESEARCH_DIRECTORY }}/pnpm-lock.yaml
            ${{ env.RELOAD_RESEARCH_DIRECTORY }}/tsconfig.json
            ${{ env.RELOAD_RESEARCH_DIRECTORY }}/plan.md
          if-no-files-found: error
          retention-days: 30
