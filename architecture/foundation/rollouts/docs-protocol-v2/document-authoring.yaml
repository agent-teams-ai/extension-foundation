schemaVersion: 3
projectId: extension-foundation
catalog:
  metadataSchemaPath: docs/metadata.schema.json
  ownerCatalog:
    path: docs/owners.yaml
    contract: foundation.owner-map/v1
  collections:
    - kind: markdown-tree
      root: docs
  excludedPrefixes:
    - docs/templates
authoring:
  mode: create-only
  ownerSets:
    schemaVersion: 1
    sets:
      architecture-docs: [architecture, architecture/security, architecture/tooling]
  artifactTypes:
    - type: adr
      initialStatus: proposed
      identity: {kind: explicit, format: adr-four-digits}
      placement: {kind: collection, directory: docs/decisions, filename: numeric-id-slug}
      template: {kind: fenced-markdown-body, path: docs/templates/adr.md}
      heading: {kind: id-colon-title}
      reachability: {kind: manual-fixed-index, indexPath: docs/decisions/README.md}
      ownerSetId: architecture-docs
    - type: open-decision
      initialStatus: open
      identity: {kind: explicit, format: open-decision-three-digits}
      placement: {kind: collection, directory: docs/open-decisions, filename: id-slug}
      template: {kind: fenced-markdown-body, path: docs/templates/open-decision.md}
      heading: {kind: id-colon-title}
      reachability: {kind: manual-fixed-index, indexPath: docs/open-decisions/README.md}
      ownerSetId: architecture-docs
    - type: architecture
      initialStatus: proposed
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments: [architecture]
          minSuffixSegments: 1
          maxSuffixSegments: 1
      placement: {kind: collection, directory: docs/architecture, filename: slug}
      template: {kind: fenced-markdown-body, path: docs/templates/architecture.md}
      heading: {kind: title}
      reachability: {kind: manual-fixed-index, indexPath: docs/README.md}
      ownerSetId: architecture-docs
