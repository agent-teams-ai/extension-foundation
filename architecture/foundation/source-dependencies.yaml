schemaVersion: 3
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
packageRoots:
  - fixtures/qualification-toy-package
rootPackage: true
governedRoots:
  - architecture/checks
  - architecture/tooling
  - fixtures/qualification-toy-package
  - tests
boundaries:
  - id: repository.architecture-checks
    dependencyMode: development
    roots:
      - architecture/checks/dogfooding-protocol-model.mjs
      - architecture/checks/evidence-custody-cli.mjs
      - architecture/checks/evidence-custody.mjs
      - architecture/checks/feature-module-standard-profile.mjs
      - architecture/checks/package-artifacts.mjs
      - architecture/checks/package-topology.mjs
      - architecture/checks/product-source-evidence-cli.mjs
      - architecture/checks/product-source-evidence.d.mts
      - architecture/checks/product-source-evidence.mjs
      - architecture/checks/scaffold.mjs
      - architecture/checks/source-safety.mjs
    entrypoints:
      - architecture/checks/evidence-custody.mjs
      - architecture/checks/feature-module-standard-profile.mjs
      - architecture/checks/package-artifacts.mjs
      - architecture/checks/package-topology.mjs
      - architecture/checks/product-source-evidence.mjs
      - architecture/checks/scaffold.mjs
      - architecture/checks/source-safety.mjs
    allow:
      boundaries:
        - repository.package-policy
        - repository.shared-policy-primitives
      builtins:
        - node:child_process
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:path
        - node:url
        - node:util
      packages:
        - "@agent-teams/docs-protocol"
        - "@agent-teams/engineering-foundation"
        - oxc-parser
        - typescript
        - yaml
      runtimeReferences: []
  - id: repository.package-policy
    dependencyMode: development
    roots:
      - architecture/checks/package-policy.mjs
      - architecture/checks/package-policy.d.mts
    entrypoints:
      - architecture/checks/package-policy.mjs
    allow:
      boundaries:
        - repository.package-policy-pure
        - repository.package-policy-sources
        - repository.shared-policy-primitives
      builtins:
        - node:child_process
        - node:crypto
        - node:fs/promises
        - node:path
        - node:url
        - node:util
      packages:
        - "@agent-teams/docs-protocol"
        - "@agent-teams/engineering-foundation"
        - yaml
      runtimeReferences: []
  - id: repository.package-policy-pure
    dependencyMode: development
    roots:
      - architecture/checks/package-policy/catalog-policy.mjs
      - architecture/checks/package-policy/accepted-decision-policy.mjs
      - architecture/checks/package-policy/admission-policy.mjs
      - architecture/checks/package-policy/ownership-policy.mjs
    entrypoints:
      - architecture/checks/package-policy/catalog-policy.mjs
      - architecture/checks/package-policy/accepted-decision-policy.mjs
      - architecture/checks/package-policy/admission-policy.mjs
      - architecture/checks/package-policy/ownership-policy.mjs
    allow:
      boundaries: []
      builtins: []
      packages: []
      runtimeReferences: []
  - id: repository.package-policy-sources
    dependencyMode: development
    roots:
      - architecture/checks/package-policy/docs-owner-source.mjs
      - architecture/checks/package-policy/accepted-decision-source.mjs
      - architecture/checks/package-policy/repository-policy-source.mjs
    entrypoints:
      - architecture/checks/package-policy/docs-owner-source.mjs
      - architecture/checks/package-policy/accepted-decision-source.mjs
      - architecture/checks/package-policy/repository-policy-source.mjs
    allow:
      boundaries:
        - repository.package-policy-pure
      builtins: []
      packages: []
      runtimeReferences: []
  - id: repository.shared-policy-primitives
    dependencyMode: development
    roots:
      - architecture/checks/strict-json.mjs
    entrypoints:
      - architecture/checks/strict-json.mjs
    allow:
      boundaries: []
      builtins: []
      packages: []
      runtimeReferences: []
  - id: repository.markdownlint-config
    dependencyMode: development
    roots:
      - architecture/tooling/markdownlint-cli2.mjs
    entrypoints:
      - architecture/tooling/markdownlint-cli2.mjs
    allow:
      boundaries: []
      builtins: []
      packages: []
      runtimeReferences: []
  - id: repository.qualification-toy-package
    dependencyMode: development
    roots:
      - fixtures/qualification-toy-package
    entrypoints:
      - fixtures/qualification-toy-package/index.js
    allow:
      boundaries: []
      builtins: []
      packages: []
      runtimeReferences: []
  - id: repository.tests
    dependencyMode: development
