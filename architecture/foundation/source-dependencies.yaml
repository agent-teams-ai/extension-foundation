schemaVersion: 1
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
governedRoots:
  - architecture/checks
  - tests
boundaries:
  - id: repository.architecture-checks
    dependencyMode: development
    roots:
      - architecture/checks
    entrypoints:
      - architecture/checks/evidence-custody.mjs
      - architecture/checks/package-artifacts.mjs
      - architecture/checks/package-topology.mjs
      - architecture/checks/product-source-evidence.mjs
      - architecture/checks/scaffold.mjs
      - architecture/checks/source-safety.mjs
    allow:
      boundaries:
        - repository.package-policy
        - repository.shared-policy-primitives
      builtins:
        - node:child_process
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:path
        - node:url
        - node:util
      packages:
        - "@agent-teams/docs-protocol"
        - "@agent-teams/engineering-foundation"
        - oxc-parser
        - typescript
        - yaml
      runtimeReferences: []
  - id: repository.package-policy
    dependencyMode: development
    roots:
      - architecture/checks/package-policy.mjs
    entrypoints:
      - architecture/checks/package-policy.mjs
    allow:
      boundaries:
        - repository.package-policy-pure
        - repository.package-policy-sources
        - repository.shared-policy-primitives
      builtins:
        - node:child_process
        - node:crypto
        - node:fs/promises
        - node:path
        - node:url
        - node:util
      packages:
        - "@agent-teams/docs-protocol"
        - "@agent-teams/engineering-foundation"
        - yaml
      runtimeReferences: []
  - id: repository.package-policy-pure
    dependencyMode: development
    roots:
      - architecture/checks/package-policy/catalog-policy.mjs
      - architecture/checks/package-policy/accepted-decision-policy.mjs
      - architecture/checks/package-policy/admission-policy.mjs
      - architecture/checks/package-policy/ownership-policy.mjs
    entrypoints:
      - architecture/checks/package-policy/catalog-policy.mjs
      - architecture/checks/package-policy/accepted-decision-policy.mjs
      - architecture/checks/package-policy/admission-policy.mjs
      - architecture/checks/package-policy/ownership-policy.mjs
    allow:
      boundaries: []
      builtins: []
      packages: []
      runtimeReferences: []
  - id: repository.package-policy-sources
    dependencyMode: development
    roots:
      - architecture/checks/package-policy/docs-owner-source.mjs
      - architecture/checks/package-policy/accepted-decision-source.mjs
      - architecture/checks/package-policy/repository-policy-source.mjs
    entrypoints:
      - architecture/checks/package-policy/docs-owner-source.mjs
      - architecture/checks/package-policy/accepted-decision-source.mjs
      - architecture/checks/package-policy/repository-policy-source.mjs
    allow:
      boundaries:
        - repository.package-policy-pure
      builtins: []
      packages: []
      runtimeReferences: []
  - id: repository.shared-policy-primitives
    dependencyMode: development
    roots:
      - architecture/checks/strict-json.mjs
    entrypoints:
      - architecture/checks/strict-json.mjs
    allow:
      boundaries: []
      builtins: []
      packages: []
      runtimeReferences: []
  - id: repository.tests
    dependencyMode: development
    roots:
      - tests
    entrypoints:
      - tests/architecture-topology.test.mjs
      - tests/docs-protocol-qualification.test.mjs
      - tests/document-authoring.test.mjs
      - tests/evidence-custody.test.mjs
      - tests/package-policy-characterization.test.mjs
      - tests/package-policy-source-boundaries.test.mjs
      - tests/scaffolding.test.mjs
      - tests/qualification/dossier.test.ts
      - tests/qualification/product-source-evidence.test.ts
      - tests/qualification/productization.test.ts
      - tests/qualification/spikes.test.ts
    allow:
      boundaries:
        - repository.architecture-checks
        - repository.package-policy
        - repository.package-policy-sources
        - repository.shared-policy-primitives
      packages:
        - "@dagrejs/graphlib"
        - "@deepseek-ai/cordis"
        - "@extism/extism"
        - "@agent-teams/docs-protocol"
        - "@agent-teams/engineering-foundation"
        - fast-check
        - yaml
      builtins:
        - node:assert/strict
        - node:child_process
        - node:crypto
        - node:events
        - node:fs
        - node:fs/promises
        - node:http
        - node:net
        - node:os
        - node:path
        - node:perf_hooks
        - node:test
        - node:timers/promises
        - node:url
        - node:util
        - node:worker_threads
      runtimeReferences: []
