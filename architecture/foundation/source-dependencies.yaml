schemaVersion: 1
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
governedRoots:
  - architecture/checks
  - tests
boundaries:
  - id: repository.architecture-checks
    dependencyMode: development
    roots:
      - architecture/checks
    entrypoints:
      - architecture/checks/package-artifacts.mjs
      - architecture/checks/package-policy.mjs
      - architecture/checks/package-topology.mjs
      - architecture/checks/scaffold.mjs
      - architecture/checks/source-safety.mjs
    allow:
      boundaries: []
      builtins:
        - node:child_process
        - node:fs
        - node:fs/promises
        - node:path
        - node:url
        - node:util
      packages:
        - "@agent-teams/docs-protocol"
        - "@agent-teams/engineering-foundation"
        - oxc-parser
        - typescript
        - yaml
      runtimeReferences: []
  - id: repository.tests
    dependencyMode: development
    roots:
      - tests
    entrypoints:
      - tests/architecture-topology.test.mjs
      - tests/docs-protocol-qualification.test.mjs
      - tests/document-authoring.test.mjs
      - tests/scaffolding.test.mjs
    allow:
      boundaries:
        - repository.architecture-checks
      packages:
        - "@agent-teams/docs-protocol"
        - "@agent-teams/engineering-foundation"
      builtins:
        - node:assert/strict
        - node:child_process
        - node:fs/promises
        - node:os
        - node:path
        - node:test
        - node:url
        - node:util
      runtimeReferences: []
