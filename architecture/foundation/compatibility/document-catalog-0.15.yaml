# Temporary read-only profile for Engineering Foundation 0.15.x.
# Delete after the document writer release is adopted.
schemaVersion: 1
projectId: extension-foundation
catalog:
  metadataSchemaPath: docs/metadata.schema.json
  ownerCatalog:
    path: docs/owners.yaml
    contract: foundation.owner-map/v1
  collections:
    - kind: markdown-tree
      root: docs
  excludedPrefixes:
    - docs/templates
authoring:
  mode: create-only
  artifactTypes:
    - type: adr
      initialStatus: proposed
      identity: {kind: explicit, format: adr-four-digits}
      placement: {kind: collection, directory: docs/decisions, filename: numeric-id-slug}
      template: {kind: fenced-markdown-body, path: docs/templates/adr.md}
      heading: {kind: id-colon-title}
    - type: open-decision
      initialStatus: open
      identity: {kind: explicit, format: open-decision-three-digits}
      placement: {kind: collection, directory: docs/open-decisions, filename: id-slug}
      template: {kind: fenced-markdown-body, path: docs/templates/open-decision.md}
      heading: {kind: id-colon-title}
