schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: docs
    script: docs:changed
    extensions: [.md]
    passPaths: false
fullScanPaths:
  - .github/workflows
  - architecture/checks
  - architecture/foundation
  - architecture/package-catalog.json
  - packages
  - tests
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
