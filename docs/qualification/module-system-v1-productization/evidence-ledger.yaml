schemaVersion: 1
campaignId: module-system-v1-productization-2026-08-28
status: review-ready
claims:
  - id: effective-authority
    classification: proved
    sources:
      - docs/decisions/0013-first-consumer-module-semantics-before-foundation-extraction.md
      - docs/decisions/0014-product-local-module-authoring-composition-and-generation-guardrails.md
      - docs/decisions/0015-authorize-get-modular-semantic-extraction.md
    result: >-
      Accepted ADR-0015 supersedes ADR-0013 only for extraction timing: it
      authorizes an independent product-neutral Get Modular 0.x while retaining
      ADR-0013 and ADR-0014 product-first, Pure DI, runtime-trigger, public-SPI,
      and owning-product safeguards. Qualification evidence adds no successor
      gate. An accepted owning-product decision is still required where those
      retained safeguards or ADR-0014 require one.
    reversalCondition: An accepted superseding ADR changes ownership or authoring policy.
  - id: existing-spike-coverage
    classification: partially-proved
    sources:
      - docs/qualification/universal-module-extension-system/spike-results.md
      - tests/qualification/spikes.test.ts
    result: >-
      Existing disposable graph, lifecycle, recovery, host, and Cordis evidence
      is substantial but does not establish a product grammar, production graph,
      durable runtime, or public SPI. Lifecycle remediation is committed as
      3c31341, is integrated in this branch, and passes the full local gate.
      Final independent exact-head review at
      97662d634b5eebd9865099830c0d7f124c7dc133 remains external PR evidence.
    reversalCondition: Exact-head execution or review contradicts the recorded coverage.
  - id: agent-runtime-consumer-admission
    classification: level-separated
    sources:
      - repository: agent-teams-ai/agent-runtime
        revision: 7be998237a4c262bee9c4198d554b43cd2757ac6
      - docs/qualification/module-system-v1-productization/consumer-source-evidence.yaml
    evidence:
      - local-exact-mirror-verification
    result: >-
      The canonical lock records exact Git custody for selected Agent Runtime
      files. It does not interpret source or establish topology, values, or
      runtime behavior. The verdict is SOURCE_CUSTODY_BASELINE_RECORDED; L1
      remains a no-go measurement candidate and L2-L5 remain no-go.
    reversalCondition: >-
      Invalidate SOURCE_CUSTODY_BASELINE_RECORDED and block dossier-dependent
      decisions if exact source verification fails. The ADR-0015-retained
      product-owned Pure DI default remains authoritative. Reopen product-local
      L1 only after a product-owned decision and approved benchmark prove an
      authoring or drift problem; higher levels retain their independent product
      triggers. Independent Get Modular 0.x follows ADR-0015 instead.
  - id: orchestrator-consumer-admission
    classification: no-go
    sources:
      - repository: agent-teams-ai/agent-teams-orchestrator
        revision: 4c5f55366ed8c83f97374b66c8e9f84059c47382
      - docs/qualification/module-system-v1-productization/consumer-source-evidence.yaml
    evidence:
      - local-exact-mirror-verification
    result: >-
      Exact Git custody is recorded for selected Orchestrator blobs. No portable
      product-owned evidence admits L1-L5.
    reversalCondition: An owning-product decision and executable evidence admit a named level.
  - id: frontend-consumer-admission
    classification: no-go-measurement-candidate
    sources:
      - repository: 777genius/agent-teams-ai
        revision: 85c0850e2fc312b995ba3116f8d4aa46dcb0b1dd
      - docs/qualification/module-system-v1-productization/consumer-source-evidence.yaml
    evidence:
      - local-exact-mirror-verification
    result: >-
      The canonical lock records exact Git custody for selected Frontend files.
      It does not interpret imports, constructions, publication, provider
      execution, or use-case dataflow. The source may seed an owning-product
      measurement, but no portable evidence establishes an authoring need,
      product grammar, or exit condition.
    reversalCondition: >-
      Product evidence removes the candidate, or a Frontend-owned decision and
      benchmark prove a concrete authoring problem that justifies an L1 comparison.
  - id: executable-product-source-evidence
    classification: candidate-only
    sources:
      - architecture/checks/product-source-evidence.mjs
      - tests/qualification/product-source-evidence.test.ts
      - docs/qualification/module-system-v1-productization/consumer-source-evidence.yaml
    evidence:
      - local-exact-mirror-verification
    result: >-
      The exact-git-source-custody mode reproduces exact origin, commit, tree,
      and declared regular-file blob identities against three explicitly mapped
      local mirrors. It performs no source interpretation.
      It proves no semantic dataflow, reference values, runtime behavior,
      authorization, lifecycle, fail-fast behavior, output correctness, provider
      execution, independence, remote attestation, or product decision authority.
    reversalCondition: The verifier, exact Git objects, configured origin, bounds, or portable-path evidence fails.
  - id: authoring-api
    classification: conditional
    sources:
      - docs/qualification/module-system-v1-productization/authoring-api-and-gap-matrix.md
    result: >-
      Handwritten typed factories and static Pure DI remain the selected baseline.
      No declarative framework is preselected. A measured declaration, profile,
      or zero-evaluation discovery trigger and an owning-product decision must
      compare the smallest inert and typed candidates against this baseline.
    reversalCondition: A real product trigger and measured implementation comparison justify another candidate.
  - id: private-runtime-graph
    classification: no-go
    sources:
      - agent-teams-ai/agent-runtime@7be998237a4c262bee9c4198d554b43cd2757ac6
      - agent-teams-ai/agent-teams-orchestrator@4c5f55366ed8c83f97374b66c8e9f84059c47382
      - 777genius/agent-teams-ai@85c0850e2fc312b995ba3116f8d4aa46dcb0b1dd
    result: No portable product-owned evidence admits runtime selection beyond static composition.
    reversalCondition: One product proves selection must change without rebuild and accepts its own private selection-graph decision.
  - id: lifecycle-coordinator
    classification: no-go
    sources:
      - docs/qualification/module-system-v1-productization/current-roadmap.yaml
    result: No portable product-owned evidence admits dependency-aware lifecycle coordination.
    reversalCondition: A named product proves bounded readiness, drain, rollback, or recovery cannot remain in its existing owner.
  - id: shared-foundation-extraction
    classification: no-go
    sources:
      - docs/decisions/0015-authorize-get-modular-semantic-extraction.md
    result: >-
      ADR-0015 authorizes an independent Get Modular 0.x, not semantic extraction
      into Extension Foundation and not a public plugin SPI. No portable evidence
      proves the independent implementations and conformance required for either
      of those separate publication surfaces.
    reversalCondition: >-
      A separate accepted decision admits a named Foundation or public-SPI
      contract after its independent-implementation and conformance gates pass.
  - id: evidence-custody-integrity
    classification: partially-proved
    sources:
      - architecture/checks/evidence-custody.mjs
      - architecture/evidence-custody-manifest.schema.json
    result: >-
      Current hardening for trusted manifest identity, bounded capture,
      latest-attempt aliasing, platform-qualified live-source reads, and
      owner-only storage passes the full local gate. Historical corpus custody
      remains honestly unproven.
      V2 can invalidate evidence but cannot authorize promotion; final
      independent exact-head review at
      97662d634b5eebd9865099830c0d7f124c7dc133 remains external PR evidence.
    reversalCondition: Integrated exact-head checks or review find unresolved fail-open behavior.
