schemaVersion: 1
campaignId: module-system-v1-productization-2026-08-28
status: review-ready
claims:
  - id: effective-authority
    classification: proved
    sources:
      - docs/decisions/0013-first-consumer-module-semantics-before-foundation-extraction.md
      - docs/decisions/0014-product-local-module-authoring-composition-and-generation-guardrails.md
    evidence:
      - module-v1-audit-decisions-r1
      - module-v1-tiebreak-ownership-a-r1
      - module-v1-tiebreak-ownership-b-r1
      - module-v1-api-critic-governance-r1
    result: >-
      Accepted ADR-0013 assigns private module semantics to the first product,
      and accepted ADR-0014 is the product-local authoring authority under that
      assignment. Qualification evidence adds no successor gate. An accepted
      owning-product decision is still required where ADR-0013 or ADR-0014 says so.
    reversalCondition: An accepted superseding ADR changes ownership or authoring policy.
  - id: existing-spike-coverage
    classification: partially-proved
    sources:
      - docs/qualification/universal-module-extension-system/spike-results.md
      - tests/qualification/spikes.test.ts
    evidence:
      - module-v1-pr17-architecture-review-r1
      - module-v1-pr17-correctness-review-r1
      - module-v1-pr17-lifecycle-review-r1
      - module-v1-audit-spikes-r1
      - module-v1-fix-lifecycle-r1
    result: >-
      Existing disposable graph, lifecycle, recovery, host, and Cordis evidence
      is substantial but does not establish a product grammar, production graph,
      durable runtime, or public SPI. Lifecycle remediation is committed as
      3c31341, is integrated in this branch, and passes the full local gate.
      Final independent exact-head review remains external PR evidence.
    reversalCondition: Exact-head execution or review contradicts the recorded coverage.
  - id: agent-runtime-consumer-admission
    classification: level-separated
    sources:
      - repository: agent-teams-ai/agent-runtime
        revision: 7be998237a4c262bee9c4198d554b43cd2757ac6
      - docs/qualification/module-system-v1-productization/consumer-source-evidence.yaml
    evidence:
      - local-exact-mirror-verification
      - hosted-follow-up-reports-corroboration-only
    result: >-
      Agent Runtime demonstrates exact L0 named-call topology: declared
      capability/member names and literal exact feature-factory imports accompany
      direct lexical feature-factory calls before one direct host-factory return
      containing the named host dependency properties. This does not establish
      that references carry values or prove runtime behavior. The verdict is
      GO_PRODUCT_SOURCE_TOPOLOGY; L1 remains a no-go measurement candidate and
      L2-L5 remain no-go.
    reversalCondition: >-
      Revoke L0 if exact source verification fails or ambient resolution enters
      product contracts. Reopen L1 only after a product-owned decision and
      approved benchmark prove an authoring or drift problem; higher levels
      retain their independent product triggers.
  - id: orchestrator-consumer-admission
    classification: no-go
    sources:
      - repository: agent-teams-ai/agent-teams-orchestrator
        revision: 4c5f55366ed8c83f97374b66c8e9f84059c47382
      - docs/qualification/module-system-v1-productization/consumer-source-evidence.yaml
    evidence:
      - module-v1-audit-orchestrator-r1
      - module-v1-admission-operations-r1
      - module-v1-admission-security-r1
      - module-v1-admission-minimalism-r1
      - module-v1-admission-evolution-r1
    result: >-
      Host Discovery has a typed port and tests but no production source adapter,
      second contribution, or application composition root at the exact revision.
    reversalCondition: A committed product slice supplies the missing production owner, implementations, root, and outcome evidence.
  - id: frontend-consumer-admission
    classification: no-go-measurement-candidate
    sources:
      - repository: 777genius/agent-teams-ai
        revision: 85c0850e2fc312b995ba3116f8d4aa46dcb0b1dd
      - docs/qualification/module-system-v1-productization/consumer-source-evidence.yaml
    evidence:
      - module-v1-audit-frontend-r1
      - module-v1-admission-operations-r1
      - module-v1-admission-security-r1
      - module-v1-admission-minimalism-r1
      - module-v1-admission-evolution-r1
    result: >-
      Frontend Recent Projects exact custody and named topology show exact port,
      consumer, and provider imports, a literal ordered provider construction,
      one consumer construction naming that list, and one facade publication.
      No provider execution or use-case dataflow is proved. It may measure whether
      authoring would help, but it has no product decision, benchmark, grammar, or
      exit evidence.
    reversalCondition: >-
      Product evidence removes the candidate, or a Frontend-owned decision and
      benchmark prove a concrete authoring problem that justifies an L1 comparison.
  - id: executable-product-source-evidence
    classification: candidate-only
    sources:
      - architecture/checks/product-source-evidence.mjs
      - tests/qualification/product-source-evidence.test.ts
      - docs/qualification/module-system-v1-productization/consumer-source-evidence.yaml
    evidence:
      - local-exact-mirror-verification
    result: >-
      The source-custody-named-topology mode reproduces exact repository, commit,
      tree, blob, exported-symbol syntax, negative searches, restricted resolution,
      Frontend literal-provider topology, Agent Runtime named-call topology, and
      Orchestrator custody-only evidence against the three configured local mirrors.
      It proves no semantic dataflow, reference values, runtime behavior,
      authorization, lifecycle, fail-fast behavior, output correctness, provider
      execution, independence, remote attestation, or product decision authority.
    reversalCondition: The verifier, exact Git objects, configured origin, alias resolution, or restricted factory-shape evidence fails.
  - id: authoring-api
    classification: conditional
    sources:
      - docs/qualification/module-system-v1-productization/authoring-api-and-gap-matrix.md
    evidence:
      - module-v1-api-schema-factory-r1
      - module-v1-api-ts-builder-r1
      - module-v1-api-json-handles-r1
      - module-v1-api-critic-typescript-r1
      - module-v1-api-critic-ai-dx-r1
      - module-v1-api-critic-governance-r1
      - module-v1-api-critic-operations-r1
    result: >-
      Handwritten typed factories and static Pure DI remain the selected baseline.
      No declarative framework is preselected. A measured declaration, profile,
      or zero-evaluation discovery trigger and an owning-product decision must
      compare the smallest inert and typed candidates against this baseline.
    reversalCondition: A real product trigger and measured implementation comparison justify another candidate.
  - id: private-runtime-graph
    classification: no-go
    sources:
      - agent-teams-ai/agent-runtime@7be998237a4c262bee9c4198d554b43cd2757ac6
      - agent-teams-ai/agent-teams-orchestrator@4c5f55366ed8c83f97374b66c8e9f84059c47382
      - 777genius/agent-teams-ai@85c0850e2fc312b995ba3116f8d4aa46dcb0b1dd
    evidence:
      - module-v1-audit-agent-runtime-r2
      - module-v1-audit-orchestrator-r1
      - module-v1-audit-frontend-r1
      - module-v1-admission-operations-r1
      - module-v1-admission-security-r1
      - module-v1-admission-minimalism-r1
      - module-v1-admission-evolution-r1
    result: No inspected product proves runtime selection that static composition cannot satisfy.
    reversalCondition: One product proves selection must change without rebuild and accepts its own private selection-graph decision.
  - id: lifecycle-coordinator
    classification: no-go
    sources:
      - docs/qualification/module-system-v1-productization/current-roadmap.yaml
    evidence:
      - module-v1-audit-spikes-r1
      - module-v1-redteam-lifecycle-r1
    result: No inspected product candidate has independently managed resources requiring dependency-aware lifecycle coordination.
    reversalCondition: A named product proves bounded readiness, drain, rollback, or recovery cannot remain in its existing owner.
  - id: shared-foundation-extraction
    classification: no-go
    sources:
      - docs/decisions/0013-first-consumer-module-semantics-before-foundation-extraction.md
    evidence:
      - module-v1-audit-agent-runtime-r2
      - module-v1-audit-orchestrator-r1
      - module-v1-audit-frontend-r1
      - module-v1-admission-operations-r1
      - module-v1-admission-security-r1
      - module-v1-admission-minimalism-r1
      - module-v1-admission-evolution-r1
    result: Products share a composition pattern, not one independently implemented semantic contract with cross-consumer conformance.
    reversalCondition: Two products independently implement the same candidate and pass executable cross-consumer conformance under a separate extraction decision.
  - id: evidence-custody-integrity
    classification: partially-proved
    sources:
      - architecture/checks/evidence-custody.mjs
      - architecture/evidence-custody-manifest.schema.json
    evidence:
      - module-v1-pr17-evidence-review-r1
      - module-v1-fix-custody-r1
    result: >-
      Current hardening for trusted manifest identity, bounded capture,
      latest-attempt aliasing, platform-qualified live-source reads, and
      owner-only storage passes the full local gate. Historical corpus custody
      remains honestly unproven.
      V1 can invalidate evidence but cannot authorize promotion; final
      independent exact-head review remains external PR evidence.
    reversalCondition: Integrated exact-head checks or review find unresolved fail-open behavior.
