schemaVersion: 1
campaignId: umeq-nightly-2026-08-26
status: running
purpose: >-
  Falsify, refine, or qualify the proposed universal module and extension
  architecture using primary-source research, executable spikes, independent
  criticism, red-team analysis, and evidence-bound arbitration.
baseline:
  repository: agent-teams-ai/extension-foundation
  pullRequest: 17
  baseRevision: 78850cbc57a1a688913a3694ca6f0efde34ab192
  qualificationRevision: 733d2fa030e8aec72c15dbba35a4e083a50b6bd2
  branch: research/universal-module-extension-nightly-evidence
execution:
  runtime: subscription-runtime-hosted
  model: gpt-5.6-sol
  reasoningEffort: xhigh
  serviceTier: default
  localSubagentsAllowed: false
  baseDistinctWorkers: 124
  adaptiveMaximumDistinctWorkers: 140
  maximumParallelWorkers: 12
  canonicalAdrsMutable: false
  productionPackagesMutable: false
  notes:
    - Logical review roles may exceed the distinct-worker count because selected
      primary researchers are continued into non-overlapping critic roles.
    - Additional workers are admitted only for unresolved contradictions,
      missing primary evidence, failed spikes, or P0/P1 findings.
evidencePolicy:
  primarySourcesRequiredPerRecommendation: 2
  immutableSourceIdentityRequired: true
  versionAndLicenseVerificationRequired: true
  executableClaimsNeedSpikeOrHypothesisLabel: true
  opinionWithoutEvidenceIsDecisionAuthority: false
  workerVoteIsDecisionAuthority: false
  acceptedAdrChangesRequireProductOwnerApproval: true
  severitiesBlockingSynthesis:
    - P0
    - P1
  resultSchema:
    required:
      - claim
      - sources
      - observedVersions
      - applicability
      - benefits
      - failureModes
      - counterexamples
      - rejectedPatterns
      - confidence
      - recommendedDecision
      - conditionsToReverse
      - unresolvedQuestions
      - evidenceLimitations
