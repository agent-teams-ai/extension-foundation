adaptiveWorkers:
  budget: 16
  admissionReasons:
    - unresolved-strong-contradiction
    - missing-primary-source
    - failed-or-inconclusive-spike
    - p0-or-p1-remediation-review
    - exact-evidence-provenance-dispute
  forbiddenReasons:
    - increase-vote-count
    - repeat-an-identical-prompt
    - confirm-a-preferred-answer
promotionGates:
  researchSynthesis:
    requires:
      - all primary waves terminal or explicitly failed with replacement evidence
      - all source identities pinned
      - every recommendation has two independent primary sources
      - all executable claims have spike evidence or hypothesis labels
  finalRecommendation:
    requires:
      - all seven domains have four critic roles
      - red-team complete
      - no unresolved P0 or P1
      - contradiction audit complete
      - evidence provenance audit complete
  decisionPromotion:
    requires:
      - product-owner review
      - separate ADR change
      - no automatic merge from this campaign
deliverables:
  - executive-report
