schemaVersion: 2
projectId: extension-foundation-qualification
catalog:
  metadataSchemaPath: docs/metadata.schema.json
  ownerCatalog: {path: docs/owners.yaml, contract: foundation.owner-map/v1}
  collections:
    - {kind: markdown-tree, root: docs/open-decisions}
  excludedPrefixes: [docs/templates]
authoring:
  mode: create-only
  artifactTypes:
    - type: open-decision
      initialStatus: open
      identity: {kind: explicit, format: open-decision-three-digits}
      placement: {kind: collection, directory: docs/open-decisions/generated, filename: id-slug}
      template: {kind: fenced-markdown-body, path: docs/templates/open-decision.md}
      heading: {kind: id-colon-title}
      reachability: {kind: manual-fixed-index, indexPath: docs/open-decisions/README.md}
      allowedOwnerIds: [architecture/tooling]
