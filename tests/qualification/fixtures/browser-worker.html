<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Browser Worker qualification</title>
<pre id="result">pending</pre>
<script type="module">
  import { createDispatchTracker } from "../portable-protocol.mjs";

  const worker = new Worker(new URL("./portable-browser-worker.mjs", import.meta.url), { type: "module" });
  const request = {
    protocol: "agent-teams.extension-host/v1",
    requestId: "browser-request-1",
    operationId: "browser-operation-1",
    dispatchNonce: "undispatched",
    authorityScope: "tenant:test/project:test",
    extensionInstanceId: "extension-instance-1",
    graphGeneration: 1,
    moduleActivationGeneration: 7,
    hostIncarnation: "host-incarnation-1",
    senderId: "product-host",
    audience: "extension-host",
    absoluteDeadline: Date.now() + 60_000,
    kind: "prepare",
    payload: {},
  };
  const tracker = createDispatchTracker();
  const dispatch = tracker.createDispatch(request, {
    authorityScope: request.authorityScope,
    extensionInstanceId: request.extensionInstanceId,
    graphGeneration: request.graphGeneration,
    moduleActivationGeneration: request.moduleActivationGeneration,
    hostIncarnation: request.hostIncarnation,
    authenticatedPeerId: "product-host",
    audience: "extension-host",
    now: Date.now(),
  }, "result");
  worker.onmessage = event => {
    try {
      if (event.data?.ok !== true) throw new Error(String(event.data?.error ?? "WORKER_RESPONSE_FAILED"));
      const frame = tracker.validateResponseEnvelope(event.data.frame, {
        authorityScope: request.authorityScope,
        extensionInstanceId: request.extensionInstanceId,
        graphGeneration: request.graphGeneration,
        moduleActivationGeneration: request.moduleActivationGeneration,
        hostIncarnation: request.hostIncarnation,
        authenticatedPeerId: "extension-host",
        audience: "product-host",
        now: Date.now(),
      }, dispatch.receipt);
      document.querySelector("#result").textContent = JSON.stringify({ ok: true, frame });
    } catch (error) {
      document.querySelector("#result").textContent = JSON.stringify({
        ok: false,
        error: error instanceof Error ? error.message : String(error),
      });
    }
    tracker.close();
    worker.terminate();
  };
  worker.onerror = event => {
    document.querySelector("#result").textContent = JSON.stringify({
      ok: false,
      error: event.message || "BROWSER_WORKER_ERROR",
    });
    tracker.close();
    worker.terminate();
  };
  worker.postMessage(dispatch.request);
</script>
</html>
