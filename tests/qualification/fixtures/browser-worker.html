<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Browser Worker qualification</title>
<pre id="result">pending</pre>
<script type="module">
  const worker = new Worker(new URL("./portable-browser-worker.mjs", import.meta.url), { type: "module" });
  worker.onmessage = event => {
    document.querySelector("#result").textContent = JSON.stringify(event.data);
    worker.terminate();
  };
  worker.postMessage({
    protocol: "agent-teams.extension-host/v1",
    requestId: "browser-request-1",
    operationId: "browser-operation-1",
    graphGeneration: 1,
    runtimeGeneration: 7,
    absoluteDeadline: Date.now() + 5_000,
    kind: "prepare",
    payload: {},
  });
</script>
</html>
